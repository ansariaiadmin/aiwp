name: QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory-php-native:
    name: Factory PHP native (8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, zip, json, tokenizer
          tools: composer:v2
      - name: Validate composer
        run: composer validate --strict
      - name: Install deps
        run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: composer lint
      - name: Run tests (25 tests)
        run: php tools/tests/run-tests.php

  factory-php-docker:
    name: Factory PHP docker php:8.2-cli (CI without php runner)
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps + composer
        run: |
          apt-get update && apt-get install -y unzip zip git
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          php -v
          composer --version
      - name: Validate + Lint + Tests inside docker
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer run lint:syntax
          php tools/tests/run-tests.php

  e2e-docker:
    name: E2E docker login flow (HOSTNAME=0.0.0.0 + Origin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build platform image
        run: docker build -t aiwp-platform ./platform
      - name: Start postgres + app containers
        run: |
          docker network create e2e
          docker run -d --name db --network e2e \
            -e POSTGRES_USER=aiwp -e POSTGRES_PASSWORD=aiwp -e POSTGRES_DB=aiwp \
            postgres:16-alpine
          # HOSTNAME=0.0.0.0 is what the production image sets; the CSRF
          # origin check must accept a browser-style Origin against the
          # request Host header, not against the bind address.
          docker run -d --name app --network e2e -p 3000:3000 \
            -e HOSTNAME=0.0.0.0 \
            -e DATABASE_URL=postgresql://aiwp:aiwp@db:5432/aiwp \
            -e SESSION_SECRET=e2e-session-secret-0123456789abcdef0123456789abcdef \
            -e ENCRYPTION_KEY=e2e-encryption-key-0123456789ab \
            aiwp-platform
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker logs app || true
          echo "FAIL: health endpoint never became ready"
          exit 1
      - name: Migrate DB + seed admin
        run: |
          docker exec app node scripts/migrate.mjs
          docker exec app node scripts/seed-admin.mjs --email admin@example.com --password 'E2e-Pass-123' --name Admin
      - name: Login from two IPs with matching Origin header
        run: |
          CODE=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -H 'X-Forwarded-For: 192.168.1.1, 10.0.0.1' \
            -d '{"email":"admin@example.com","password":"E2e-Pass-123"}')
          echo "login status: $CODE"; cat /tmp/login.json
          test "$CODE" = "200"
      - name: Cross-origin mutation must be rejected (403)
        run: |
          CODE=$(curl -s -o /tmp/csrf.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://evil.example' \
            -d '{"email":"admin@example.com","password":"E2e-Pass-123"}')
          echo "csrf status: $CODE"; cat /tmp/csrf.json
          test "$CODE" = "403"
      - name: Tear down
        if: always()
        run: docker rm -f app db || true; docker network rm e2e || true

  platform:
    name: Platform (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (no env)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
