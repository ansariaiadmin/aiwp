services:
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://aiwp:aiwp@db:5432/aiwp
      # Required at boot by platform/src/lib/env.ts — the app exits with a
      # clear error without them, so they must be passed through here.
      # Generate real values: openssl rand -base64 48
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET (min 32 chars) in .env or the shell — e.g. `openssl rand -base64 48`}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY (min 16 chars) in .env or the shell — e.g. `openssl rand -base64 32`}
      # Public URL of this deployment (emails, links). Override in .env: APP_URL=https://example.com
      - APP_URL=${APP_URL:-http://localhost:3000}
      # Optional: comma-separated extra trusted hosts for CSRF origin checks.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiwp
      POSTGRES_PASSWORD: aiwp
      POSTGRES_DB: aiwp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
