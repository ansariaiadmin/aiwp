services:
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-aiwp}:${POSTGRES_PASSWORD:-aiwp}@db:5432/${POSTGRES_DB:-aiwp}}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiwp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiwp}
      POSTGRES_DB: ${POSTGRES_DB:-aiwp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
