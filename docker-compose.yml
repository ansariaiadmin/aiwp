services:
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://aiwp:aiwp@db:5432/aiwp
      # Required at boot by src/lib/env.ts (validateEnv via instrumentation.ts).
      # install.sh generates these into .env; without them the container crash-loops.
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env (install.sh does this automatically)}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (install.sh does this automatically)}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiwp
      POSTGRES_PASSWORD: aiwp
      POSTGRES_DB: aiwp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
